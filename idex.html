<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">



</head>


<style>
    * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;

    }

    body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;

        background-image: url('https://img.freepik.com/premium-vector/river-tree-night-landscape_104785-154.jpg');
        background-position: center;

        background-size: cover;

    }

    .conatiner {

        width: 420px;
        background: transparent;
        border: 2px solid rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(20px);
        box-shadow: 0 0 10px rgba(0, 0, 0, .2);
        color: #fff;
        border-radius: 10px;
        padding: 30px 40px;

    }

    .conatiner h1 {
        font-size: 36px;
        text-align: center;
    }

    .conatiner .card {
        position: relative;
        width: 100%;
        height: 50px;
        margin: 30px 0;
    }

    .register {
        font-size: 14.5px;
        text-align: center;
        margin: 20px 0 15px;

    }

    .register p a {
        color: #fff;
        text-decoration: none;
        font-weight: 600;
    }

    .register p a:hover {
        text-decoration: underline;
    }

    .card input {
        width: 100%;
        height: 100%;
        background: transparent;
        border: none;
        outline: none;
        border: 2px solid rgba(255, 255, 255, .2);
        border-radius: 40px;
        font-size: 16px;
        color: #696262;
        padding: 20px 45px 20px 20px;
    }

    .card input::placeholder {
        color: #fff;
    }

    .card i {
        position: absolute;
        right: 20px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 20px;
        ;
    }

    .conatiner .remeber {
        display: flex;
        justify-content: space-between;
        margin: -15px 0 15px;
        font-size: 14.5px;

    }

    .remeber label input {
        accent-color: #fff;
        margin: 3px;
    }

    .remeber a {
        color: #fff;
        text-decoration: none;
    }

    .remeber a:hover {
        text-decoration: underline;
    }

    .btn {
        width: 100%;
        height: 45px;
        border: none;
        outline: none;
        border-radius: 40px;
        background: #fff;
        box-shadow: 0 0 10px rgba(0, 0, 0, .2);
        cursor: pointer;
        font-size: 16px;
        color: #333;
        font-weight: 600;
    }
</style>

<body>
    <div class="conatiner">
        <form action="">
            <h1>Login</h1>


            <div class="card">
                <input type="email" id="text" placeholder="Enter Email" required>
                <i class="bi bi-person"></i>

            </div>
            <div class="card">
                <input type="password" id="pass" placeholder="Enter password" required>
                <i class="bi bi-lock"></i>
            </div>
            <div class="remeber">
                <label><input type="checkbox">Remember me</label>
                <a href="#">Forget password?</a>
            </div>
            <button type="submit" class="btn">Login</button>

            <div class="register">
                <p>Don't have an account?<a href="#">Register</a></p>

            </div>

    </div>
    </form>
    </div>
</body>

</html>
